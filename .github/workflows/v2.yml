name: V2 verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...
      - run: go test ./internal/fanout -run '^$' -bench '^BenchmarkFanout$' -benchtime=40x -count=3 | tee go-fanout-bench.txt
      - uses: actions/upload-artifact@v6
        with:
          name: go-fanout-bench
          path: go-fanout-bench.txt

  legacy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r ws-fanout/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_admin_ui.cjs

  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts
      - run: npm --prefix web run typecheck && npm --prefix web run lint && npm --prefix web run build
      - run: npm --prefix web audit --audit-level=high
      - run: node web/node_modules/playwright-core/cli.js install --with-deps chromium
      - run: npm --prefix web run browser
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: console-before-after
          path: artifacts/browser/
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: bash scripts/build-release.sh
      - run: (cd dist && sha256sum --check SHA256SUMS)
      - name: Rebuild and compare release checksums
        run: |
          cp dist/SHA256SUMS "$RUNNER_TEMP/first-SHA256SUMS"
          bash scripts/build-release.sh
          cmp "$RUNNER_TEMP/first-SHA256SUMS" dist/SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: dist/

  installation:
    needs: release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: linux-release
          path: dist
      - run: (cd dist && sha256sum --check SHA256SUMS)
      - run: sudo apt-get update && sudo apt-get install -y nginx python3-venv
      - run: bash tests/install-linux.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: install-${{ matrix.os }}
          path: artifacts/install/
          if-no-files-found: error

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - run: go run github.com/zricethezav/gitleaks/v8@v8.28.0 dir --redact=100 --verbose --no-banner .

  ui-prototypes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm --prefix web ci --ignore-scripts
      - run: node web/node_modules/playwright-core/cli.js install --with-deps chromium
      - run: node tests/ui-prototypes.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ui-prototypes
          path: artifacts/ui-prototypes/
          if-no-files-found: error
