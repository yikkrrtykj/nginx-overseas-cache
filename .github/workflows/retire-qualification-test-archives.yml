name: Retire superseded test-only qualification archives
on:
  push:
    branches: [codex/qualification-evidence-redaction]
permissions:
  actions: write
jobs:
  redact-superseded-evidence:
    if: github.repository == 'yikkrrtykj/nginx-overseas-cache'
    runs-on: ubuntu-24.04
    steps:
      - name: Remove only the listed archives generated by this isolation lab
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > target-artifacts.json <<'JSON'
          [{"run":46120528244,"id":15253911174,"name":"qualification-ubuntu-24.04-arm","sha":"2714a67c89c9d50d041a62781b9686b07bc1df7a"},{"run":46120528244,"id":15253341675,"name":"qualification-ubuntu-24.04","sha":"2714a67c89c9d50d041a62781b9686b07bc1df7a"},{"run":46120641426,"id":15254061082,"name":"qualification-ubuntu-24.04-arm","sha":"27b0f10c441c92a48c995ec98ccac7909f76b088"},{"run":46120641426,"id":15253741767,"name":"qualification-ubuntu-26.04","sha":"27b0f10c441c92a48c995ec98ccac7909f76b088"},{"run":46120641426,"id":15253686183,"name":"qualification-ubuntu-24.04","sha":"27b0f10c441c92a48c995ec98ccac7909f76b088"},{"run":46120852756,"id":15254146125,"name":"qualification-ubuntu-24.04-arm","sha":"4dd2df8f8a968464012e683314819e5c34dbf02c"},{"run":46120852756,"id":15253906739,"name":"qualification-ubuntu-24.04","sha":"4dd2df8f8a968464012e683314819e5c34dbf02c"},{"run":46120852756,"id":15253891811,"name":"qualification-ubuntu-26.04","sha":"4dd2df8f8a968464012e683314819e5c34dbf02c"},{"run":46120933981,"id":15253872065,"name":"qualification-ubuntu-24.04-arm","sha":"30c89774c9ced3dfaf14c55d882fd0057f0a2f9b"},{"run":46120933981,"id":15253712551,"name":"qualification-ubuntu-26.04","sha":"30c89774c9ced3dfaf14c55d882fd0057f0a2f9b"},{"run":46120933981,"id":15253571888,"name":"qualification-ubuntu-24.04","sha":"30c89774c9ced3dfaf14c55d882fd0057f0a2f9b"},{"run":46120988602,"id":15254061720,"name":"qualification-ubuntu-26.04","sha":"4c3ce6aaab1cd3f41cc9a7cfde7336720871b7eb"},{"run":46120988602,"id":15253272507,"name":"qualification-ubuntu-24.04","sha":"4c3ce6aaab1cd3f41cc9a7cfde7336720871b7eb"},{"run":46120988602,"id":15253247545,"name":"qualification-ubuntu-24.04-arm","sha":"4c3ce6aaab1cd3f41cc9a7cfde7336720871b7eb"},{"run":46121102211,"id":15254027062,"name":"qualification-ubuntu-24.04","sha":"b5e985a2857bfd34efdb8ca936653a8c3ece1c02"},{"run":46121102211,"id":15254006241,"name":"qualification-ubuntu-24.04-arm","sha":"b5e985a2857bfd34efdb8ca936653a8c3ece1c02"},{"run":46121102211,"id":15253457227,"name":"qualification-ubuntu-26.04","sha":"b5e985a2857bfd34efdb8ca936653a8c3ece1c02"},{"run":46121430292,"id":15254047733,"name":"qualification-ubuntu-26.04","sha":"b301d841be0f21857a51f438118a96a98878395d"},{"run":46121430292,"id":15253367928,"name":"qualification-ubuntu-24.04","sha":"b301d841be0f21857a51f438118a96a98878395d"},{"run":46121430292,"id":15253258155,"name":"qualification-ubuntu-24.04-arm","sha":"b301d841be0f21857a51f438118a96a98878395d"},{"run":46121489136,"id":15253618826,"name":"qualification-ubuntu-24.04-arm","sha":"ef7c61131edc5d2b97dd6a2d8186ad60dc893a92"},{"run":46121489136,"id":15253348030,"name":"qualification-ubuntu-24.04","sha":"ef7c61131edc5d2b97dd6a2d8186ad60dc893a92"},{"run":46121489136,"id":15253073919,"name":"qualification-ubuntu-26.04","sha":"ef7c61131edc5d2b97dd6a2d8186ad60dc893a92"},{"run":46121828796,"id":15254236690,"name":"qualification-ubuntu-26.04","sha":"2820abb95bdeee51791f6eaaec182e6efa7f9d16"},{"run":46121828796,"id":15253928575,"name":"qualification-ubuntu-24.04-arm","sha":"2820abb95bdeee51791f6eaaec182e6efa7f9d16"},{"run":46121828796,"id":15253559630,"name":"qualification-ubuntu-24.04","sha":"2820abb95bdeee51791f6eaaec182e6efa7f9d16"}]
          JSON
          jq -r '.[] | [.run, .id, .name, .sha] | @tsv' target-artifacts.json | while IFS=$'\t' read -r run id name sha; do
            case "$name" in qualification-ubuntu-24.04|qualification-ubuntu-26.04|qualification-ubuntu-24.04-arm) ;; *) exit 2 ;; esac
            metadata=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts")
            if ! jq -e --argjson id "$id" --arg name "$name" --arg sha "$sha" \
              '.artifacts[] | select(.id == $id and .name == $name and .workflow_run.head_branch == "codex/preproduction-qualification" and .workflow_run.head_sha == $sha)' \
              >/dev/null <<<"$metadata"; then
              echo "Expected qualification archive $id was absent or did not match. No deletion for this ID."
              continue
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            echo "Removed superseded qualification output $id"
          done
