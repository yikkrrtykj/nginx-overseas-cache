name: Stop superseded guest recovery attempt
on:
  push:
    branches: [codex/qualification-evidence-redaction]
permissions:
  actions: write
jobs:
  stop-superseded-run:
    if: github.repository == 'yikkrrtykj/nginx-overseas-cache'
    runs-on: ubuntu-24.04
    steps:
      - name: Stop only the superseded two-guest PR check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=46121913241
          data=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$target")
          jq -e '.head_sha == "5b3221b3c2ce59fb9f05645ea1de9435a02d628d" and .head_branch == "codex/install-recovery-before-nginx" and .path == ".github/workflows/deployment-recovery.yml"' >/dev/null <<<"$data"
          if [[ $(jq -r '.status' <<<"$data") != completed ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$target/cancel"
          fi
