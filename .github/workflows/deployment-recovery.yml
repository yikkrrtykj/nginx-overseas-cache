name: Nginx and installer crash recovery
on:
  pull_request:
    paths:
      - 'cmd/config-helper/**'
      - 'internal/configstore/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'tests/qualification/**'
      - '.github/workflows/deployment-recovery.yml'
permissions:
  contents: read
jobs:
  reboot:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ['24.04', '26.04']
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: bash -n scripts/install-admin.sh && go test ./internal/configstore ./cmd/config-helper && bash scripts/build-release.sh
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf ubuntu-cloudimage-keyring
      - run: bash tests/qualification/boot.sh '${{ matrix.release }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reboot-${{ matrix.release }}
          path: artifacts/boot/
          if-no-files-found: error
