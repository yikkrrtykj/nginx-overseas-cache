name: Nginx and installer crash recovery
on:
  pull_request:
    paths:
      - 'cmd/config-helper/**'
      - 'internal/configstore/**'
      - 'internal/atomicfile/**'
      - 'scripts/**'
      - 'systemd/**'
      - 'tests/qualification/**'
      - '.github/workflows/deployment-recovery.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: deployment-recovery-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Build the exact PR revision
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD 'HEAD^{tree}'
          for script in scripts/install-admin.sh tests/qualification/{boot,boot-guest,recovery-boundaries}.sh; do bash -n "$script"; done
          go test ./internal/configstore ./cmd/config-helper
          bash scripts/build-release.sh
          ( cd dist && sha256sum --check SHA256SUMS )
      - uses: actions/upload-artifact@v6
        with:
          name: recovery-linux-release
          path: dist/
          if-no-files-found: error
  reboot:
    needs: candidate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ['24.04', '26.04']
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: recovery-linux-release
          path: dist
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 46076576495
          artifact-ids: '15236030131'
          path: legacy-dist
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf ubuntu-cloudimage-keyring
      - run: bash tests/qualification/boot.sh '${{ matrix.release }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reboot-${{ matrix.release }}
          path: artifacts/boot/
          if-no-files-found: error
  same-boot:
    needs: candidate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04, ubuntu-24.04-arm]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: recovery-linux-release
          path: dist
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 46122474079
          name: linux-release
          path: prior-dist
      - run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT bash tests/qualification/recovery-boundaries.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: recovery-boundaries-${{ matrix.os }}
          path: artifacts/recovery-boundaries/
          if-no-files-found: error
