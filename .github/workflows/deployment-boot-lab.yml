name: Isolated boot and interrupted-install qualification
on:
  push:
    branches: [codex/preproduction-boot-lab]
permissions:
  contents: read
  actions: read
jobs:
  reboot:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        release: ['24.04', '26.04']
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          run-id: 46076576495
          name: linux-release
          path: dist
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf ubuntu-cloudimage-keyring
      - run: bash tests/qualification/boot.sh '${{ matrix.release }}'
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reboot-${{ matrix.release }}
          path: artifacts/boot/
          if-no-files-found: error
