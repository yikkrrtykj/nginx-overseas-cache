<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理员登录 | Overseas Cache</title>
    <meta name="description" content="内网海外页面代理管理登录">
    <link rel="stylesheet" href="app.css">
  </head>
  <body class="login-body">
    <header class="topbar">
      <div class="frame topbar-inner">
        <a class="brand" href="/login" aria-label="Overseas Cache 登录">
          <svg class="brand-mark" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h7l7 5-7 5H5"/><circle cx="5" cy="7" r="2"/><circle cx="5" cy="17" r="2"/><circle cx="19" cy="12" r="2"/></svg>
          <span>Overseas Cache</span>
        </a>
      </div>
    </header>

    <main class="frame login-shell">
      <section class="login-card" aria-labelledby="login-title">
        <h1 id="login-title">管理员登录</h1>
        <p class="login-copy">请输入服务器管理账号，不是渲染页面的 accountId。</p>
        <noscript><p class="noscript-note">启用 JavaScript 后才能登录。</p></noscript>
        <form id="loginForm" method="post" autocomplete="on">
          <label class="field">
            <span>用户名</span>
            <input id="username" name="username" value="admin" autocomplete="username" required autofocus>
          </label>
          <label class="field">
            <span>密码</span>
            <div class="token-control">
              <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="loginError" required>
              <button class="quiet-button" id="toggleLoginPassword" type="button" aria-label="显示或隐藏密码">显示</button>
            </div>
          </label>
          <p class="login-error" id="loginError" role="alert"></p>
          <button class="primary-button login-button" id="loginButton" type="submit">进入控制台</button>
        </form>
      </section>

      <aside class="login-context" aria-labelledby="access-title">
        <h2 id="access-title">内网管理入口</h2>
        <p>登录后可修改上游域名、频道参数和访问令牌。</p>
        <dl class="access-facts">
          <div><dt>访问范围</dt><dd>可信内网</dd></div>
          <div><dt>会话有效期</dt><dd><time datetime="PT8H">8 小时</time></dd></div>
          <div><dt>连接方式</dt><dd>HTTP</dd></div>
        </dl>
        <p class="http-warning">当前为 HTTP 内网连接。请勿通过公共 Wi-Fi 或互联网访问本页面。</p>
      </aside>
    </main>
    <script src="/login.js" defer></script>
  </body>
</html>
