# Shared upstream connection pools.
upstream webcoder_origin {
    server webcoder.atum.live:443;
    keepalive 64;
}

upstream webcoder_cdn {
    server webcodercdn.atum.live:443;
    keepalive 128;
}

# Canonical upstream hostnames used by Host, TLS SNI, redirects, content
# rewriting and cache keys in the site configuration. change-upstreams.sh
# updates these defaults together with the upstream server addresses.
map $host $overseas_origin_host {
    default webcoder.atum.live;
}

map $host $overseas_cdn_host {
    default webcodercdn.atum.live;
}

# Static-object cache. Dynamic pages and WebSocket traffic do not use it.
proxy_cache_path /var/cache/nginx/web_cache
    levels=1:2
    keys_zone=web_cache:100m
    max_size=20g
    inactive=7d
    use_temp_path=off;

# Do not log query strings or Referer values because the renderer URL contains
# a sensitive channel token. The server block selects this format explicitly.
log_format overseas_cache_safe
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"$http_user_agent" rt=$request_time urt=$upstream_response_time '
    'cache=$upstream_cache_status';

# Upgrade WebSocket requests while keeping normal upstream connections reusable.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Preserve the browser Origin for fonts and other cross-origin static assets.
map $http_origin $cors_allow_origin {
    default $http_origin;
    ''      '*';
}
