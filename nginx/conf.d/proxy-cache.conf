# Shared upstream connection pools.
upstream webcoder_origin {
    server webcoder.atum.live:443;
    keepalive 64;
}

upstream webcoder_cdn {
    server webcodercdn.atum.live:443;
    keepalive 128;
}

# Canonical upstream hostnames used by Host, TLS SNI, redirects, content
# rewriting and cache keys in the site configuration. change-upstreams.sh
# updates these defaults together with the upstream server addresses.
map $host $overseas_origin_host {
    default webcoder.atum.live;
}

map $host $overseas_cdn_host {
    default webcodercdn.atum.live;
}

# Static-object cache. Dynamic pages and WebSocket traffic do not use it.
proxy_cache_path /var/cache/nginx/web_cache
    levels=1:2
    keys_zone=web_cache:100m
    max_size=20g
    inactive=7d
    use_temp_path=off;

# Classify requests without writing their path. In particular,
# /templates-auth/<channel>/<token>/... contains a sensitive token in the path.
map $uri $overseas_log_route {
    default              other;
    /render              render;
    ~^/templates-auth/   templates-auth;
    ~^/templates/        templates;
}

# Fixed categories and counters only. Do not include client headers, URLs or
# upstream addresses. The upstream status values are used to count attempts.
log_format overseas_cache_safe escape=json
    '{"time":"$time_iso8601","route":"$overseas_log_route","status":$status,'
    '"bytes":$body_bytes_sent,"cache":"$upstream_cache_status","upstream":"$upstream_status"}';

map "$http_authorization|$http_cookie|$is_args|$http_range" $overseas_skip_cache {
    "|||"   0;
    default 1;
}

# Browser WebSockets originate from the same renderer authority. Local
# non-browser clients may omit Origin.
map "$http_origin|$http_host" $overseas_ws_origin_allowed {
    default 0;
    ~^\| 1;
    "~*^https?://([^|]+)\|\1$" 1;
}

# Upgrade WebSocket requests while keeping normal upstream connections reusable.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Preserve the browser Origin for fonts and other cross-origin static assets.
map $http_origin $cors_allow_origin {
    default $http_origin;
    ''      '*';
}
